[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaka-qiscans"
version = "0.2.0"
description = "Qi Scans content adapter for Mangaka"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "beautifulsoup4==4.13.5",
  "requests==2.33.0",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["qiscans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
